# 시계.
#
# 수집 로직은 Vercel 위의 Next.js 안에 있고, 여기는 매시 그걸 때리기만 한다.
# 코드가 한 곳에 있고(브라우저로 직접 호출해 수동 실행·디버그도 된다), 새
# 플랫폼 계정이 안 늘어난다는 게 이 구조를 고른 이유다.
#
# 주의 둘:
#  - GitHub 스케줄은 정시에 안 돈다. 부하에 따라 5~20분 밀린다. "정각"을
#    전제로 설계하지 마라(그래서 하루 끝 한 장도 18시 '정각'이 아니라 '18시대'다).
#  - 저장소가 60일간 무활동이면 GitHub이 스케줄 워크플로를 자동 비활성화한다.
#    혼자 쓰는 저장소라 실제로 걸릴 수 있다 — Actions 탭에서 다시 켜면 된다.
name: collect

on:
  schedule:
    - cron: "0 * * * *" # 매시 정각(UTC) — 밀리는 건 위 주의 참고
  workflow_dispatch:
    inputs:
      module:
        description: "특정 모듈만 (비우면 전부)"
        required: false
        default: ""

# 앞 회차가 아직 돌고 있으면 겹치지 않게 건너뛴다
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 수집 트리거 (유저별 순차)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail
          base="$BASE_URL/api/collect"

          # 완전 개인화(07-30): 수집이 유저별로 돈다. Vercel 함수가 60초 상한이라
          # 전원을 한 호출에 묶을 수 없다 — 목록을 받아 한 명씩 부른다.
          # 한 명이 실패해도 나머지는 계속 돈다.
          users=$(curl -sS "$base?list=1" -H "authorization: Bearer $CRON_SECRET" --max-time 30 \
            | jq -r '.users[]')
          echo "users: $(echo $users | tr '\n' ' ')"

          failed=0
          for uid in $users; do
            url="$base?user=$uid"
            if [ -n "${MODULE:-}" ]; then url="$url&module=$MODULE"; fi
            echo "── user $uid ──"
            code=$(curl -sS -X POST "$url" \
              -H "authorization: Bearer $CRON_SECRET" \
              -w '\n%{http_code}' -o /tmp/out.json --max-time 120 | tail -1)
            cat /tmp/out.json
            echo
            if [ "$code" != "200" ]; then
              echo "::error::user $uid 수집 실패 (HTTP $code)"
              failed=1
            fi
          done
          exit $failed
